default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      # Local protection only: this scans the staged diff, so it catches a secret
      # as you commit it. It is a no-op on a fresh checkout (index == HEAD).
      - id: gitleaks
      # CI's `secrets` job runs this one: the same gitleaks, scanning the working
      # tree. Manual stage, so local commits do not pay for a full scan.
      - id: gitleaks
        alias: gitleaks-dir
        name: gitleaks (working tree)
        entry: gitleaks dir --redact --verbose
        pass_filenames: false
        always_run: true
        stages: [manual]

  - repo: https://github.com/jdx/jactionlint
    rev: a65ab044e916760429068fe5794b8306abdfcbb9 # frozen: v2.3.0
    hooks:
      - id: jactionlint

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4 # frozen: v0.24.0
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt --check
        entry: pnpm oxfmt --check
        language: system
        types_or: [ts, tsx, javascript, jsx]
        pass_filenames: false
      - id: oxlint
        name: oxlint
        entry: pnpm oxlint
        language: system
        types_or: [ts, tsx, javascript, jsx]
        pass_filenames: false
      - id: tsc
        name: tsc --noEmit
        entry: pnpm typecheck
        language: system
        pass_filenames: false
      - id: vitest
        name: vitest (unit + component)
        entry: pnpm vitest run --exclude test/integration
        language: system
        pass_filenames: false
