name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs the same hooks contributors run locally (.pre-commit-config.yaml) —
  # file hygiene, markdownlint, oxfmt, oxlint, tsc and the vitest suite — plus
  # a build step the hooks deliberately don't cover (see below).
  #
  # pnpm install comes first because the oxfmt/oxlint/tsc/vitest hooks are
  # `language: system` — they shell out to pnpm and need node_modules present.
  #
  # commitlint is at the commit-msg stage and `prek run` skips it automatically.
  # test:integration is excluded by the vitest hook and needs a live CiviCRM
  # (CIVI_INTEGRATION=1), so it stays a local/manual step.
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version: pnpm/action-setup reads packageManager in package.json, the one pnpm pin.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        env:
          # The engines floor (>=22.0.0 in package.json); Renovate moves it within 22.x.
          # renovate: datasource=node-version depName=node
          NODE_VERSION: 22.23.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          # renovate: datasource=github-releases depName=j178/prek extractVersion=^v(?<version>.+)$
          PREK_VERSION: 0.5.4
        with:
          prek-version: ${{ env.PREK_VERSION }}

      # The tsc hook runs `tsc --noEmit` against tsconfig.json (src + test), so
      # it type-checks but never exercises emit. tsconfig.build.json is the
      # other half: src only, `noEmit: false`, and it produces the dist/cli.js
      # this package ships as its `bin`. Without this step the first thing to
      # run it is `prepublishOnly`, i.e. a codegen regression would surface at
      # release rather than on the PR that caused it.
      #
      # Not a prek hook: a full emit pass on every local commit mostly repeats
      # work the --noEmit hook already did, and the risk it covers is
      # release-shaped, so CI is where it earns its keep.
      - name: Build (verifies emit, which `tsc --noEmit` cannot)
        run: pnpm build

  # The gitleaks pre-commit hook runs `gitleaks git --pre-commit --staged`, which
  # diffs the index against HEAD. On a fresh checkout those are identical, so the
  # hook is a silent no-op under `prek run --all-files` and cannot gate anything.
  # This job runs the manual-stage `gitleaks-dir` hook instead, which scans the
  # working tree with the same gitleaks build, so the hook's `rev:` in
  # .pre-commit-config.yaml is the one gitleaks pin and local and CI scan with the
  # same rules.
  #
  # Uses the MIT-licensed CLI rather than gitleaks-action, which has been
  # proprietary since v2.0.0 and requires a GITLEAKS_LICENSE secret for
  # organisation accounts.
  secrets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan working tree for secrets
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          # renovate: datasource=github-releases depName=j178/prek extractVersion=^v(?<version>.+)$
          PREK_VERSION: 0.5.4
        with:
          prek-version: ${{ env.PREK_VERSION }}
          extra-args: --hook-stage manual gitleaks-dir --all-files
