# Dependabot keeps npm, the pre-commit hooks and the action SHAs. Renovate (renovate.json5) keeps
# the runner image, packageManager's pnpm and the tool versions CI installs. Each pin has one
# owner.

version: 2
updates:
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      hooks:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Node dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # packageManager's pnpm is Renovate's.
      - dependency-name: "pnpm"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions. Pins are SHAs with version comments; Dependabot
  # rewrites both. Majors stay outside the group so they arrive singly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
